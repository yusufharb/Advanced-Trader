    <script>
      (function() {
        // Intercept Vite HMR WebSocket to completely prevent "WebSocket closed without opened" errors
        const OrigWebSocket = window.WebSocket;
        if (typeof OrigWebSocket !== 'undefined') {
          const isViteSocket = function(url, protocols) {
            const u = String(url || '');
            const p = String(protocols || '');
            return p.includes('vite-hmr') || u.includes('token=') || u.includes('/@vite');
          };

          function FakeViteWebSocket(url, protocols) {
            if (!isViteSocket(url, protocols)) {
              return new OrigWebSocket(url, protocols);
            }
            const target = new EventTarget();
            target.url = url;
            target.protocol = 'vite-hmr';
            target.readyState = 1; // WebSocket.OPEN
            target.CONNECTING = 0;
            target.OPEN = 1;
            target.CLOSING = 2;
            target.CLOSED = 3;
            target.send = function() {};
            target.close = function() {
              target.readyState = 3;
              try {
                target.dispatchEvent(new Event('close'));
              } catch (_) {}
            };
            setTimeout(function() {
              try {
                target.dispatchEvent(new Event('open'));
              } catch (_) {}
            }, 0);
            return target;
          }

          FakeViteWebSocket.CONNECTING = 0;
          FakeViteWebSocket.OPEN = 1;
          FakeViteWebSocket.CLOSING = 2;
          FakeViteWebSocket.CLOSED = 3;
          FakeViteWebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket = FakeViteWebSocket;
        }

        const isViteOrWs = function(...args) {
          return args.some(function(arg) {
            if (!arg) return false;
            const s = (typeof arg === 'string') ? arg : ((arg.message || '') + ' ' + (arg.stack || '') + ' ' + String(arg));
            return s.includes('WebSocket') || s.includes('WebSocket closed') || s.includes('[vite]') || s.includes('vite-hmr');
          });
        };

        const origConsoleError = console.error;
        console.error = function(...args) {
          if (isViteOrWs(...args)) return;
          origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function(...args) {
          if (isViteOrWs(...args)) return;
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          const msg = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
          if (isViteOrWs(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event && event.reason;
          const msg = (reason && (reason.message || reason.stack)) || String(reason || '');
          if (isViteOrWs(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
