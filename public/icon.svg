<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" stroke="#374151" stroke-width="4"/>
  
  <!-- Subtle grid lines -->
  <path d="M 64 160 H 448 M 64 256 H 448 M 64 352 H 448" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 160 64 V 448 M 256 64 V 448 M 352 64 V 448" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- Candlestick 1 (Bearish red/gold) -->
  <line x1="140" y1="210" x2="140" y2="390" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <rect x="122" y="250" width="36" height="90" rx="4" fill="#F59E0B"/>
  
  <!-- Candlestick 2 (Bullish green) -->
  <line x1="220" y1="160" x2="220" y2="360" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
  <rect x="202" y="190" width="36" height="120" rx="4" fill="url(#emerald)"/>
  
  <!-- Candlestick 3 (Bullish high impulse) -->
  <line x1="300" y1="110" x2="300" y2="310" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
  <rect x="282" y="140" width="36" height="110" rx="4" fill="url(#emerald)"/>
  
  <!-- Candlestick 4 (Consolidation gold) -->
  <line x1="380" y1="120" x2="380" y2="280" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  <rect x="362" y="150" width="36" height="70" rx="4" fill="url(#gold)"/>
  
  <!-- Dynamic EMA / Trend Line Curve -->
  <path d="M 100 370 Q 200 310, 260 210 T 430 110" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Golden crest accent -->
  <circle cx="430" cy="110" r="10" fill="#FBBF24" stroke="#FFF" stroke-width="3"/>
</svg>
